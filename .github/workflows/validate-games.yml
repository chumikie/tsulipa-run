name: Check TsuLiPa special games

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.sql'
      - 'vercel.json'
      - 'tools/lint/**'
      - '.github/workflows/validate-games.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.sql'
      - 'vercel.json'
      - 'tools/lint/**'
      - '.github/workflows/validate-games.yml'

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lint tooling
        run: npm ci --prefix tools/lint
      - name: Lint extracted browser modules
        run: npm --prefix tools/lint run lint
      - name: Validate game HTML and routes
        run: node tests/validate-games.js
      - name: Smoke test local page and stylesheet resources
        run: node tests/static-links.test.js
      - name: Validate nine-player room state machine
        run: node tests/karaoke-room-model.test.js
      - name: Validate original rhythm minigame
        run: node tests/karaoke-rhythm.test.js
      - name: Validate Karaoke homol stage, queue and safety
        run: node tests/karaoke-homol-view.test.js
      - name: Validate Karaoke realtime lifecycle and recovery
        run: node tests/karaoke-homol-sync.test.js
      - name: Validate Karaoke 3A.11 lease renewal and browser restore
        run: node tests/karaoke-homol-refresh.test.js
      - name: Validate Sora mobile and iframe stability
        run: node tests/sora-stability.test.js
      - name: Validate actual INDEX 2 weekly podium integration
        run: node tests/tw-weekly-podium.test.js
      - name: Validate critical account, purchase and save flows
        run: node tests/index-critical-flows.test.js
      - name: Validate anonymous session reuse
        run: node tests/karaoke-reuse-session.test.js
      - name: Karaoke online (produção)
        run: node tests/karaoke-online.test.js
