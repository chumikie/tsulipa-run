name: Check TsuLiPa special games

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'index2.html'
      - 'sora-jump.html'
      - 'karaoke-day.html'
      - 'karaoke-time.html'
      - 'karaoke-popup.css'
      - 'karaoke-homol-view.js'
      - 'karaoke-homol-client.js'
      - 'karaoke-homol-sync.js'
      - 'tests/karaoke-homol-sync.test.js'
      - 'supabase/sql/karaoke_lab_*.sql'
      - 'supabase/tests/karaoke_lab_*.sql'
      - 'tests/karaoke-homol-view.test.js'
      - 'games-theme.css'
      - 'index2-skin.css'
      - 'tw-windows.css'
      - 'tw-windows.js'
      - 'tests/windows-shared.test.js'
      - 'tests/windows-browser.cjs'
      - 'tw-mic-cd-popup.css'
      - 'sora-embed.css'
      - 'karaoke-embed.css'
      - 'karaoke-rhythm.js'
      - 'karaoke-rhythm.css'
      - 'tests/karaoke-rhythm.test.js'
      - 'karaoke-online-lab.html'
      - 'karaoke-room-model.js'
      - 'tests/karaoke-room-model.test.js'
      - 'tests/validate-games.js'
      - 'tests/sora-stability.test.js'
      - 'tests/karaoke-homol-refresh.test.js'
      - 'tests/tw-weekly-podium.test.js'
      - 'tests/login-simulado.test.js'
      - 'supabase/sql/tw_weekly_podium_proposal.sql'
      - 'supabase/sql/admin_pet_visual_tools.sql'
      - '.github/workflows/validate-games.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index2.html'
      - 'sora-jump.html'
      - 'karaoke-day.html'
      - 'karaoke-time.html'
      - 'karaoke-popup.css'
      - 'karaoke-homol-view.js'
      - 'karaoke-homol-client.js'
      - 'karaoke-homol-sync.js'
      - 'tests/karaoke-homol-sync.test.js'
      - 'supabase/sql/karaoke_lab_*.sql'
      - 'supabase/tests/karaoke_lab_*.sql'
      - 'tests/karaoke-homol-view.test.js'
      - 'games-theme.css'
      - 'index2-skin.css'
      - 'tw-windows.css'
      - 'tw-windows.js'
      - 'tests/windows-shared.test.js'
      - 'tests/windows-browser.cjs'
      - 'tw-mic-cd-popup.css'
      - 'sora-embed.css'
      - 'karaoke-embed.css'
      - 'karaoke-rhythm.js'
      - 'karaoke-rhythm.css'
      - 'tests/karaoke-rhythm.test.js'
      - 'karaoke-online-lab.html'
      - 'karaoke-room-model.js'
      - 'tests/karaoke-room-model.test.js'
      - 'tests/validate-games.js'
      - 'tests/sora-stability.test.js'
      - 'tests/karaoke-homol-refresh.test.js'
      - 'tests/tw-weekly-podium.test.js'
      - 'tests/login-simulado.test.js'
      - 'supabase/sql/tw_weekly_podium_proposal.sql'
      - 'supabase/sql/admin_pet_visual_tools.sql'
      - '.github/workflows/validate-games.yml'

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared window contracts
        run: node tests/windows-shared.test.js
      - name: Validate game HTML and routes
        run: node tests/validate-games.js
      - name: Validate nine-player room state machine
        run: node tests/karaoke-room-model.test.js
      - name: Validate original rhythm minigame
        run: node tests/karaoke-rhythm.test.js
      - name: Validate Karaoke homol stage, queue and safety
        run: node tests/karaoke-homol-view.test.js
      - name: Validate Karaoke realtime lifecycle and recovery
        run: node tests/karaoke-homol-sync.test.js
      - name: Validate Karaoke 3A.11 lease renewal and browser restore
        run: node tests/karaoke-homol-refresh.test.js
      - name: Validate Sora mobile and iframe stability
        run: node tests/sora-stability.test.js
      - name: Validate actual INDEX 2 weekly podium integration
        run: node tests/tw-weekly-podium.test.js
      - name: Karaoke online (produção)
        run: node tests/karaoke-online.test.js
      - name: Cards com login simulado (e interruptor de teste desligado)
        run: node tests/login-simulado.test.js


