name: Check TsuLiPa special games

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all site checks (tests/run-all.js)
        run: node tests/run-all.js
      - name: Validate Karaoke mobile viewport script
        run: node --check karaoke-mobile.js
      - name: Validate Karaoke photo preview script
        run: node --check karaoke-photo.js
      - name: Validate Karaoke room Polaroid controller
        run: node --check karaoke-room-polaroid.js
      - name: Validate Karaoke autonomous mic controller
        run: node --check karaoke-room-auto-mic.js
      - name: Validate Karaoke Polaroid controller
        run: node --check karaoke-room-polaroid.js



  postgres-center-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: center_run_test
        options: >-
          --health-cmd "pg_isready -U postgres -d center_run_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Center Run daily cap against isolated PostgreSQL
        run: bash supabase/tests/center_run_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify Karaoke ticket lifecycle against isolated PostgreSQL
        run: bash supabase/tests/karaoke_ticket_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify admin Idol editor proposal against isolated PostgreSQL
        run: bash supabase/tests/admin_idol_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify Karaoke 'my position' proposal against isolated PostgreSQL
        run: bash supabase/tests/karaoke_posicao_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify Karaoke song of the week proposal against isolated PostgreSQL
        run: bash supabase/tests/karaoke_musica_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify Karaoke weekly boards proposal against isolated PostgreSQL
        run: bash supabase/tests/karaoke_quadros_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify national groups migration and authenticated profile RPCs against isolated PostgreSQL
        run: bash supabase/tests/grupos_nacionais_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify PR71 online records and badges against isolated PostgreSQL
        run: bash supabase/tests/pr71_online_pg_integration.sh "${{ job.services.postgres.id }}"
  browser-karaoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix /tmp/karaoke-playwright --no-save playwright
          /tmp/karaoke-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Fetch PR base for before/after homepage comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Compare homepage screenshots before and after translation extraction
        if: github.event_name == 'pull_request'
        env:
          NODE_PATH: /tmp/karaoke-playwright/node_modules
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tests/i18n-visual.browser.cjs /tmp/i18n-visual-captures
      - name: Verify automatic Idol moderation after reload in isolated Chromium
        if: always()
        env:
          NODE_PATH: /tmp/karaoke-playwright/node_modules
        run: node tests/admin-idol.browser.cjs /tmp/admin-idol-browser
      - name: Verify mobile room, autonomous mic and Polaroid portrait in Chromium
        env:
          NODE_PATH: /tmp/karaoke-playwright/node_modules
          QA_WIDTHS: 320,375,390,430,844,1440
        run: node tests/karaoke-mobile.browser.cjs /tmp/karaoke-room-browser
      - name: Verify profile accessories across hairstyles and viewports in Chromium
        if: always()
        env:
          NODE_PATH: /tmp/karaoke-playwright/node_modules
        run: node tests/profile-accessories.browser.cjs /tmp/profile-accessories-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-before-after-captures
          path: /tmp/i18n-visual-captures
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-idol-browser-captures
          path: /tmp/admin-idol-browser
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-accessories-browser-captures
          path: /tmp/profile-accessories-browser
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karaoke-room-browser-captures
          path: /tmp/karaoke-room-browser
          if-no-files-found: warn
          retention-days: 5
