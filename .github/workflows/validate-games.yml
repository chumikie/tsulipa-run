jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original three wavy haircuts across avatar renderers
        run: node tests/avatar-hair.test.js
      - name: Validate original Captain hat and Star across avatar renderers
        run: node tests/avatar-items.test.js
      - name: Validate Center Run auth readiness and credit reconciliation
        run: node tests/center-run-credit-recovery.test.js
      - name: Validate Center Run scenery palette renders every color
        run: node tests/center-run-palette.test.js
      - name: Validate visibility lifecycle runs inside the game scope
        run: node tests/visibility-scope.test.js
      - name: Validate Center Run daily cap and server response contract
        run: node tests/center-run-daily-cap.test.js
      - name: Validate shared window contracts
        run: node tests/windows-shared.test.js
      - name: Validate Karaoke mobile viewport script
        run: node --check karaoke-mobile.js
      - name: Validate Karaoke photo preview script
        run: node --check karaoke-photo.js
      - name: Validate Karaoke room pet visits and pandeiros
        run: node tests/karaoke-room-reactions.test.js
      - name: Validate game HTML and routes
        run: node tests/validate-games.js
      - name: Validate Backstage Pet cloud save retries and confirmations
        run: node tests/pet-sync.test.js
      - name: Privacy page translations compile
        run: node tests/privacidade-script.test.js
      - name: Validate nine-player room state machine
        run: node tests/karaoke-room-model.test.js
      - name: Validate Karaoke mobile room tile rendering optimization
        run: node tests/karaoke-mobile-performance.test.js
      - name: Validate original rhythm minigame
        run: node tests/karaoke-rhythm.test.js
      - name: Validate Karaoke Time melody note maps and checkpoint timing
        run: node tests/karaoke-note-map.test.js
      - name: Validate Karaoke Time confirmation, shortcuts and device offset
        run: node tests/karaoke-flow.test.js
      - name: Validate ticket recovery after lost responses, reload and account switch
        run: node tests/karaoke-ticket-recovery.test.js
      - name: Validate Karaoke ticket review, Gacha, inventory, gifts, moderation and safe admission
        run: node tests/karaoke-tickets.test.js
      - name: Validate visible Karaoke ticket counters, gift and Gacha balance sync
        run: node tests/karaoke-ticket-ui.test.js
      - name: Validate Karaoke Time input timestamps, visual target and timing feedback
        run: node tests/karaoke-input-timing.test.js
      - name: Validate Karaoke Time melodic cues and compact stage settings
        run: node tests/karaoke-melody-cues.test.js
      - name: Validate Karaoke Time button-perfect visual zones on all seven tracks
        run: node tests/karaoke-button-target.test.js
      - name: Validate Karaoke Time keyboard shortcuts and three-second resume
        run: node tests/karaoke-shortcuts.test.js
      - name: Validate Karaoke homol stage, queue and safety
        run: node tests/karaoke-homol-view.test.js
      - name: Validate Karaoke realtime lifecycle and recovery
        run: node tests/karaoke-homol-sync.test.js
      - name: Validate Karaoke 3A.11 lease renewal and browser restore
        run: node tests/karaoke-homol-refresh.test.js
      - name: Validate Sora mobile and iframe stability
        run: node tests/sora-stability.test.js
      - name: Validate actual INDEX 2 weekly podium integration
        run: node tests/tw-weekly-podium.test.js
      - name: Validate Backstage Admin player profile guards
        run: node tests/admin-player-profile.test.js
      - name: Karaoke online (produção)
        run: node tests/karaoke-online.test.js
      - name: Cards com login simulado (e interruptor de teste desligado)
        run: node tests/login-simulado.test.js



  postgres-center-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: center_run_test
        options: >-
          --health-cmd "pg_isready -U postgres -d center_run_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Center Run daily cap against isolated PostgreSQL
        run: bash supabase/tests/center_run_pg_integration.sh "${{ job.services.postgres.id }}"
      - name: Verify Karaoke ticket lifecycle against isolated PostgreSQL
        run: bash supabase/tests/karaoke_ticket_pg_integration.sh "${{ job.services.postgres.id }}"
