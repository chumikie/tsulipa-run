name: Check TsuLiPa special games

on:
  pull_request:
    branches: [main]
    paths:
      - 'index2.html'
      - 'sora-jump.html'
      - 'sora-jump-karaoke.html'
      - 'karaoke-day.html'
      - 'karaoke-homol-view.js'
      - 'karaoke-homol-client.js'
      - 'tests/karaoke-homol-view.test.js'
      - 'games-theme.css'
      - 'index2-skin.css'
      - 'sora-embed.css'
      - 'karaoke-embed.css'
      - 'karaoke-rhythm.js'
      - 'karaoke-rhythm.css'
      - 'tests/karaoke-rhythm.test.js'
      - 'karaoke-online-lab.html'
      - 'karaoke-room-model.js'
      - 'tests/karaoke-room-model.test.js'
      - 'tests/validate-games.js'
      - '.github/workflows/validate-games.yml'
  push:
    branches: [main]
    paths:
      - 'index2.html'
      - 'sora-jump.html'
      - 'sora-jump-karaoke.html'
      - 'karaoke-day.html'
      - 'karaoke-homol-view.js'
      - 'karaoke-homol-client.js'
      - 'tests/karaoke-homol-view.test.js'
      - 'games-theme.css'
      - 'index2-skin.css'
      - 'sora-embed.css'
      - 'karaoke-embed.css'
      - 'karaoke-rhythm.js'
      - 'karaoke-rhythm.css'
      - 'tests/karaoke-rhythm.test.js'
      - 'karaoke-online-lab.html'
      - 'karaoke-room-model.js'
      - 'tests/karaoke-room-model.test.js'
      - 'tests/validate-games.js'

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game HTML and routes
        run: node tests/validate-games.js
      - name: Validate nine-player room state machine
        run: node tests/karaoke-room-model.test.js
      - name: Validate original rhythm minigame
        run: node tests/karaoke-rhythm.test.js
      - name: Validate Karaoke homol stage, queue and safety
        run: node tests/karaoke-homol-view.test.js
