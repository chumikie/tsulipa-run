<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1b3a"><title>Sora⭐Jump! + Karaoke⭐Day · TsuLiPa⭐World</title><style>
:root{--bg1:#d0f0ff;--bg2:#b7cbf7;--card:#fff;--ink:#12365e;--sub:#5b7fa6;--b1:#7b3ff0;--pink:#ff6fb5;--chip:#eef6fd}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 14% 10%,rgba(255,255,255,.8),transparent 32%),radial-gradient(circle at 87% 88%,rgba(255,111,181,.24),transparent 40%),linear-gradient(150deg,var(--bg1),var(--bg2));overflow:hidden}
a{text-decoration:none;color:inherit}button,input{font:inherit}
#hub,#playerWrap{position:fixed;inset:0}#hub{display:flex;align-items:center;justify-content:center;padding:clamp(14px,3vw,28px);overflow:auto}#panel{width:min(940px,100%);background:var(--card);border-radius:28px;padding:clamp(16px,3vw,28px);box-shadow:0 16px 45px rgba(31,29,90,.18),0 0 0 3px rgba(255,255,255,.65)}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.back{padding:10px 14px;border-radius:999px;background:var(--chip);font-weight:800;color:var(--b1)}.langs{display:flex;gap:6px;flex-wrap:wrap}.langs button{padding:8px 10px;border:0;border-radius:999px;background:var(--chip);font-weight:800;color:var(--ink);cursor:pointer}.langs button[aria-pressed=true]{background:linear-gradient(100deg,#7b3ff0,#ff6fb5);color:#fff}.kicker{margin:12px 0 0;font-weight:900;letter-spacing:.13em;font-size:12px;color:var(--b1)}h1{margin:8px 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.12;background:linear-gradient(100deg,#7b3ff0,#ff6fb5,#4169e1);-webkit-background-clip:text;background-clip:text;color:transparent}p.sub{margin:0 0 18px;color:var(--sub);font-size:clamp(13px,2.5vw,16px)}
#nick{display:block;width:min(340px,100%);margin:0 auto;padding:12px 16px;border-radius:999px;border:2px solid #c9b2f1;text-align:center;font-weight:800;color:var(--ink)}#err{margin:8px 0 0;text-align:center;color:#bf2360;font-weight:800;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}.card{display:flex;flex-direction:column;border:2px solid #e4d7f7;border-radius:22px;background:#f5f8ff;overflow:hidden;cursor:pointer}.art{display:grid;place-items:center;min-height:140px;font-size:72px;background:linear-gradient(130deg,#8bdffb,#cfc0ff 60%,#ffe6f2)}.art.k{background:linear-gradient(130deg,#ffd2ed,#d7b6ff 60%,#a1d8ff)}.copy{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:170px}.copy h2{margin:0;font-size:22px}.copy p{margin:0;color:var(--sub);line-height:1.5}.cta{margin-top:auto;display:inline-flex;align-self:flex-start;padding:10px 15px;border-radius:999px;background:linear-gradient(100deg,#7b3ff0,#ff6fb5);font-weight:900;color:#fff;font-size:13px}
#playerWrap{display:none;background:#d0f0ff}#player{width:100%;height:100%;border:0;background:#d0f0ff}.backIn{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;padding:10px 14px;border:0;border-radius:999px;background:rgba(36,25,67,.88);color:#fff;font-weight:800;cursor:pointer}
@media(max-width:680px){.grid{grid-template-columns:1fr}.art{min-height:104px;font-size:54px}.copy{min-height:auto}}
</style></head><body>
<section id="hub"><main id="panel"><div class="top"><a class="back" href="./index.html">← Voltar ao TsuLiPa⭐World</a><div class="langs" id="langs"></div></div><div class="kicker" id="choose"></div><h1 id="ttl"></h1><p class="sub" id="sub"></p><input id="nick" maxlength="12"><div id="err" hidden></div><div class="grid"><button class="card" data-open="sora-jump.html"><div class="art">☁️⭐🪽</div><div class="copy"><h2 id="jumpT"></h2><p id="jumpD"></p><span class="cta" id="jumpC"></span></div></button><button class="card" data-open="karaoke-day.html"><div class="art k">🎤🎶🌟</div><div class="copy"><h2 id="karaT"></h2><p id="karaD"></p><span class="cta" id="karaC"></span></div></button></div></main></section>
<section id="playerWrap"><button class="backIn" id="backBtn">← Tela de jogos</button><iframe id="player" allow="autoplay"></iframe></section>
<script>
(function(){
  var tx={pt:{choose:'ESCOLHA SEU ESPAÇO',ttl:'Um mundo de estrelas ✨',sub:'Uma página separada para testar os novos botões antes de ir para a página inicial.',nick:'✨ Seu nome de Idol! ✨',err:'Digite seu nome de Idol para continuar.',jumpT:'☁️ Sora⭐Jump!',jumpD:'Pule entre nuvens, colete estrelas e descubra cenários especiais.',jumpC:'Jogar Sora Jump',karaT:'🎤 Karaoke⭐Day!',karaD:'Entre na sala de Karaoke, cante, dance e interaja com as idols.',karaC:'Entrar no Karaoke',back:'← Tela de jogos'},en:{choose:'CHOOSE YOUR SPACE',ttl:'A world of stars ✨',sub:'A separate page to test both new buttons before adding them to the home page.',nick:'✨ Your Idol name ✨',err:'Enter your Idol name to continue.',jumpT:'☁️ Sora⭐Jump!',jumpD:'Jump through the clouds and collect stars.',jumpC:'Play Sora Jump',karaT:'🎤 Karaoke⭐Day!',karaD:'Enter the Karaoke room, sing, dance and meet idols.',karaC:'Enter Karaoke',back:'← Game hub'},es:{choose:'ELIGE TU ESPACIO',ttl:'Un mundo de estrellas ✨',sub:'Una página aparte para probar los dos nuevos botones antes de llevarlos al inicio.',nick:'✨ Tu nombre de Idol ✨',err:'Escribe tu nombre de Idol.',jumpT:'☁️ Sora⭐Jump!',jumpD:'Salta entre nubes y recoge estrellas.',jumpC:'Jugar Sora Jump',karaT:'🎤 Karaoke⭐Day!',karaD:'Entra en la sala, canta, baila y convive con idols.',karaC:'Entrar al Karaoke',back:'← Pantalla de juegos'},ja:{choose:'スペースを選ぼう',ttl:'星いっぱいの世界 ✨',sub:'トップページに入れる前に、2つの新ボタンを試せる別ページです。',nick:'✨ アイドル名 ✨',err:'アイドル名を入力してください。',jumpT:'☁️ Sora⭐Jump!',jumpD:'雲を飛び越え、星を集めよう。',jumpC:'Sora Jump を遊ぶ',karaT:'🎤 Karaoke⭐Day!',karaD:'カラオケルームで歌って踊って交流しよう。',karaC:'カラオケへ',back:'← ゲーム選択'},th:{choose:'เลือกพื้นที่ของคุณ',ttl:'โลกแห่งดวงดาว ✨',sub:'หน้าแยกสำหรับทดสอบสองปุ่มใหม่ก่อนย้ายไปหน้าแรก',nick:'✨ ชื่อไอดอลของคุณ ✨',err:'กรอกชื่อไอดอลของคุณ',jumpT:'☁️ Sora⭐Jump!',jumpD:'กระโดดบนก้อนเมฆและเก็บดาว',jumpC:'เล่น Sora Jump',karaT:'🎤 Karaoke⭐Day!',karaD:'เข้าห้องคาราโอเกะ ร้อง เต้น และพบเพื่อน',karaC:'เข้าคาราโอเกะ',back:'← หน้าเลือกเกม'}};
  var lang='pt'; try{lang=localStorage.getItem('brs48cr_lang')||'pt';}catch(_){} if(!tx[lang])lang='pt'; var t=tx[lang];
  function el(id){return document.getElementById(id)}
  el('choose').textContent='TsuLiPa⭐World · '+t.choose; el('ttl').textContent=t.ttl; el('sub').textContent=t.sub; el('nick').placeholder=t.nick; el('err').textContent=t.err; el('jumpT').textContent=t.jumpT; el('jumpD').textContent=t.jumpD; el('jumpC').textContent=t.jumpC; el('karaT').textContent=t.karaT; el('karaD').textContent=t.karaD; el('karaC').textContent=t.karaC; el('backBtn').textContent=t.back;
  var langs=el('langs'); ['pt','en','es','th','ja'].forEach(function(code){ var b=document.createElement('button'); b.type='button'; b.textContent=code==='ja'?'日本語':code.toUpperCase(); b.setAttribute('aria-pressed',String(code===lang)); b.onclick=function(){try{localStorage.setItem('brs48cr_lang',code);}catch(_){} location.reload();}; langs.appendChild(b); });
  try{el('nick').value=localStorage.getItem('brs48cr_nick')||'';}catch(_){}
  function requireNick(){ var v=el('nick').value.trim(); if(!v){el('err').hidden=false; el('nick').focus(); return false;} el('err').hidden=true; try{localStorage.setItem('brs48cr_nick',v);}catch(_){} return true; }
  document.querySelectorAll('[data-open]').forEach(function(btn){btn.addEventListener('click',function(){ if(!requireNick()) return; el('hub').style.display='none'; el('playerWrap').style.display='block'; el('player').src=btn.dataset.open; });});
  el('backBtn').onclick=function(){el('player').src='about:blank'; el('playerWrap').style.display='none'; el('hub').style.display='flex';};
  window.addEventListener('message',function(e){ if(e.source!==el('player').contentWindow)return; if(location.protocol!=='file:' && e.origin!==location.origin)return; if(e.data && (e.data.type==='tsulipa-games-hub'||e.data.type==='TW_USER_KARAOKE_BACK')){el('backBtn').click();}});
})();
</script></body></html>
