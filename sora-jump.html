function histRegistrarRodada(gameKey, valor, extra){
  if(!histData) histCarregar();
  var gObj = histData.games[gameKey];
  if(!gObj){
    gObj = { best5:[], last5:[] };
    histData.games[gameKey] = gObj;
  }
  var hoje = dk();
  var c = histData.counters;

  // Atualiza dia diferente jogado (Presença VIP)
  if(c.ultimo_dia !== hoje){
    c.dias_diferentes = (c.dias_diferentes || 0) + 1;
    c.ultimo_dia = hoje;
  }
  if(gameKey === 'center_run'){
    c.total_corridas = (c.total_corridas || 0) + 1;
  }
  if(gameKey === 'sora_jump'){
    if(valor > (c.sora_max_altura || 0)) c.sora_max_altura = valor;
  }
  if(extra && extra.micTurns){
    c.turnos_mic = (c.turnos_mic || 0) + extra.micTurns;
  }

  var entry = {
    score: Math.floor(valor),
    char: (CH[sel] && CH[sel].n) || 'Idol',
    d: hoje,
    t: Date.now()
  };

  // Mantém só as 5 últimas
  gObj.last5.unshift(entry);
  if(gObj.last5.length > 5) gObj.last5.length = 5;

  // Mantém só as 5 melhores
  gObj.best5.push(entry);
  gObj.best5.sort(function(a, b){ return b.score - a.score || b.t - a.t; });
  if(gObj.best5.length > 5) gObj.best5.length = 5;

  // Verifica se virou a semana para registrar o "Center da semana" antes da limpeza semanal
  if(lw && lw.w && lw.w === wk() && lw.rows && lw.rows.length > 0){
    var topW = lw.rows[0];
    var jaTem = histData.weekly_winners.some(function(w){ return w.week === lw.w; });
    if(!jaTem && topW){
      histData.weekly_winners.unshift({ week:lw.w, name:topW.name, score:topW.score });
      if(histData.weekly_winners.length > 12) histData.weekly_winners.length = 12;
    } else if(jaTem && topW){
      histData.weekly_winners.forEach(function(w){
        if(w.week === lw.w && topW.score >= w.score){ w.name = topW.name; w.score = topW.score; }
      });
    }
  }

  histSalvar();
}

function soraOnlineApplyProfile(profile){
  var data = profile && typeof profile === 'object' ? profile : null;
  var visual = data && data.character && typeof data.character === 'object' ? data.character : {};
  var keys = ['hair','hair2','skin','eye','back','front','det','out','outcol','hat','gl'];
  var active = Object.assign({}, CH[sel] || CH[0]);
  keys.forEach(function(key){
    var value = visual[key];
    if(typeof value === 'string' && value.length <= 32) active[key] = value;
  });
  if(typeof visual.streak === 'boolean') active.streak = visual.streak;
  ['hair','hair2','skin','eye'].forEach(function(key){
    if(!/^#?[0-9a-fA-F]{6}$/.test(String(active[key]||''))) active[key] = (CH[sel]||CH[0])[key];
  });
  active.img = active.hair;
  active.n = String(data && data.nick || nick || 'Idol').replace(/[<>]/g,'').trim().slice(0,12);
  soraOnlineProfile = data ? {nick:active.n, character:active} : null;
  // Recorde da conta (sora_my_profile.best): o mesmo em qualquer aparelho, não só o deste navegador.
  var srvBest = data && Number.isFinite(+data.best) ? Math.max(0, Math.floor(+data.best)) : 0;
  if(srvBest > soraBest){ soraBest = srvBest; if($('soraMenuBest')) $('soraMenuBest').textContent = soraBest + ' m'; }
  if(data && data.nick){
    nick = String(data.nick).replace(/[<>]/g,'').trim().slice(0,12);
    var inputNick = $('nick');
    if(inputNick) inputNick.value = nick;
  }
  soraRefreshTestProfile();
  soraBindTestProfileTools();
}

function soraOnlineLoadProfile(force){
  if(!SORA_ONLINE_PROFILE_ENABLED || !soraOnlineUserId) return Promise.resolve(null);
  if(soraOnlineProfilePromise && !force) return soraOnlineProfilePromise;
  var requestedUserId = soraOnlineUserId;
  soraOnlineProfilePromise = soraEnsureSupabaseClient().then(function(client){
    return client.rpc('sora_my_profile');
  }).then(function(result){
    if(requestedUserId !== soraOnlineUserId) return null;
    if(result && result.error) throw result.error;
    var profile = result && result.data;
    if(!profile || typeof profile !== 'object') throw new Error('Perfil não encontrado para esta conta.');
    soraOnlineProfileLoaded = true;
    soraOnlineApplyProfile(profile);
    return profile;
  }).catch(function(error){
    if(requestedUserId !== soraOnlineUserId) return null;
    soraOnlineProfileLoaded = true;
    soraOnlineProfile = null;
    console.info('Sora⭐Jump: perfil online ainda indisponível; usando aparência local.', error && error.message || error);
    soraRefreshTestProfile();
    return null;
  });
  return soraOnlineProfilePromise;
}
function soraOnlineSetSession(session){
  var user = session && session.user;
  var nextId = user && user.is_anonymous !== true ? user.id : null;
  if(nextId === soraOnlineUserId) return;
  soraOnlineUserId = nextId;
  soraOnlineProfile = null;
  soraOnlineProfileLoaded = false;
  soraOnlineProfilePromise = null;
  if(soraOnlineUserId) soraOnlineLoadProfile();
  else {
    soraOnlineProfile = null;
    try{ nick = window.__TW_TEST_STORAGE.getItem('brs48cr_nick') || ''; }catch(e){}
    var localNickInput = $('nick');
    if(localNickInput) localNickInput.value = nick;
    soraRefreshTestProfile();
  }
}
function soraOnlineInitAuth(){
  return soraEnsureSupabaseClient().then(function(client){
    if(!client.auth || typeof client.auth.getSession !== 'function') return null;
    if(!soraOnlineAuthSubscription && typeof client.auth.onAuthStateChange === 'function'){
      try{
        var authWatch = client.auth.onAuthStateChange(function(_event, session){
          Promise.resolve().then(function(){ soraOnlineSetSession(session); });
        });
        soraOnlineAuthSubscription = authWatch && authWatch.data && authWatch.data.subscription || null;
      }catch(e){}
    }
    if(!soraOnlineAuthPromise){
      soraOnlineAuthPromise = client.auth.getSession().then(function(result){
        if(result && result.error) throw result.error;
        soraOnlineSetSession(result && result.data && result.data.session);
        return soraOnlineUserId;
      }).catch(function(error){
        soraOnlineUserId = null;
        console.warn('Sora⭐Jump: sessão da conta indisponível.', error);
        return null;
      });
    }
    return soraOnlineAuthPromise;
  }).catch(function(error){
    soraOnlineUserId = null;
    console.warn('Sora⭐Jump: cliente de autenticação indisponível.', error);
    return null;
  });
}

     !Number.isSafeInteger(score) || score < 0 || !soraOnlineRunStartPromise) return;

    if(!runId || !_supabase || typeof _supabase.rpc !== 'function') return null;
    return _supabase.rpc('sora_run_finish',{p_run_id:runId,p_score:score});

function soraOnlineAbortRun(){
  if(!SORA_ONLINE_RANKING_ENABLED || !soraOnlineRunStartPromise) return;

function soraJumpBounce(mult){

  }

// Preserve filtering semantics without 4 fresh arrays per animation frame.
function soraCompactAlive(list,bottom,mode){

 for(var read=0;read<list.length;read++){
  var item=list[read],keep;
  if(mode===0)keep=item.t<(item.life||30);
  else if(mode===1)keep=item.y<bottom&&!item.used;
  else if(mode===2)keep=item.y<bottom&&!item.got;
  else keep=item.y<bottom&&(!item.done||item.k==='vento');
  if(keep)list[write++]=item;
 }
 list.length=write;
 return list;
}

function soraLoop(t){
  if(!soraOpen) return;
  var dt = soraLastT ? Math.max(0.1, Math.min(2.5, (t - soraLastT) / 16.667)) : 1;
  soraLastT = t;
  if(soraState === 'play') soraUpdate(dt);
  soraDraw();
  soraRaf = requestAnimationFrame(soraLoop);
}

function soraRenderLbRows(rows, online, serial){
  var el = $('soraLbList'), source = $('soraRankSource');
  if(!el || serial !== soraRankRequestSerial) return;
  if(source) source.textContent = online ? '🌐 Ranking online' : '📱 Ranking local · salvo neste aparelho';
  if(!Array.isArray(rows) || !rows.length){
    el.innerHTML = '<li class="empty">' + escHtml(tr('Ninguém no ranking ainda. Seja a primeira pessoa!')) + '</li>';
    return;
  }
  el.innerHTML = rows.slice(0,5).map(function(r,i){
    var name = r.nick || r.name || 'Idol';
    var score = Math.max(0,Math.floor(+r.score||0));
    var extra = online ? '' : ' <small>(' + escHtml(r.char || 'Idol') + ')</small>';
    return '<li><span><b>#' + (online ? (+r.position||i+1) : i+1) + '</b> ' +
      escHtml(name) + extra + '</span><strong>' + score + ' m</strong></li>';
  }).join('');
}

function soraRenderLb(){
  var serial = ++soraRankRequestSerial;
  soraRenderLocalLb(serial);
  if(!SORA_ONLINE_RANKING_ENABLED) return;
  if(soraRankRowsCache[soraRankPeriod] &&
     Date.now() - soraRankCacheAt[soraRankPeriod] < RANK_CACHE_TTL_MS){
    soraRenderLbRows(soraRankRowsCache[soraRankPeriod], true, serial);
    return;
  }
  soraEnsureSupabaseClient().then(function(client){
    return client.rpc('sora_ranking',{p_period:soraRankPeriod});
  }).then(function(result){
    if(result && result.error) throw result.error;
    var rows = Array.isArray(result && result.data) ? result.data : [];
    soraRankRowsCache[soraRankPeriod] = rows;
    soraRankCacheAt[soraRankPeriod] = Date.now();
    soraRenderLbRows(rows, true, serial);
  }).catch(function(error){
    if(serial === soraRankRequestSerial){
      soraRenderLocalLb(serial);
      console.info('Sora⭐Jump: ranking online indisponível; mantendo placar local.', error && error.message || error);
    }
  });
}

      var msg=$('soraImportProfileMsg'), rawText=$('soraImportProfileText').value.trim();
      try{
        var data=JSON.parse(rawText);
        if(!data || typeof data!=='object' || Array.isArray(data)) throw new Error('O JSON precisa ser um objeto de perfil.');
        var allow=['brs48cr_char','brs48cr_cu2','brs48cr_ch2','brs48cr_acc','brs48cr_pet','brs48cr_nick','brs48cr_lang','brs48cr_oshi'];
        var count=0;
        allow.forEach(function(k){
          if(Object.prototype.hasOwnProperty.call(data,k)){
            if(data[k]===null || data[k]===undefined) window.__TW_TEST_STORAGE.removeItem(k);
            else window.__TW_TEST_STORAGE.setItem(k, String(data[k]));
            count++;
          }
        });
        if(count) window.__TW_TEST_STORAGE.setItem('__tw_profile_imported', '1');
        if(!count) throw new Error('Não encontrei chaves de personagem/pet reconhecidas no perfil.');
        msg.style.color='#bbf7d0'; msg.textContent='Perfil recebido ('+count+' campos). Recarregando a cópia…';
        setTimeout(function(){ location.reload(); }, 350);
      }catch(err){ msg.style.color='#fecaca'; msg.textContent='Não consegui importar: '+err.message; }
    };
  }
}
soraSetupUI();
function soraReturnToMenu(){
  if(soraState === 'play') soraOnlineAbortRun();
  soraMusicStop(); soraReset(); soraState = 'menu';
  if($('soraHomeBtn')) $('soraHomeBtn').hidden = true;
  if($('soraMenuBest')) $('soraMenuBest').textContent = soraBest + ' m';
  if($('soraMenuStars')) $('soraMenuStars').textContent = String(starT);
  if($('soraMenuBox')) $('soraMenuBox').hidden = false;
  if($('soraOverBox')) $('soraOverBox').hidden = true;
  soraRefreshTestProfile();
}
function soraOpenUI(){
  if(SORA_ONLINE_PROFILE_ENABLED){
    soraOnlineInitAuth().then(function(){
      return soraOnlineUserId ? soraOnlineLoadProfile(true) : null;
    }).then(function(){ soraOpenUIReady(); });
    return;
  }
  soraOpenUIReady();
}
function soraOpenUIReady(){
  if($('soraHomeBtn')) $('soraHomeBtn').hidden = true;
  var inputNick = $('nick');
  var nomeLimpo = (inputNick ? inputNick.value : '').trim();
  if(!nomeLimpo){
    if(inputNick){ inputNick.classList.remove('aviso-erro'); void inputNick.offsetWidth; inputNick.classList.add('aviso-erro'); inputNick.focus(); }
    if(sfx && sfx.hit) sfx.hit();
    var nm = $('nickMsg'); if(nm){ nm.hidden = false; clearTimeout(nm._t); nm._t = setTimeout(function(){ nm.hidden = true; }, 3500); }
    return;
  }
  if(!soraOpen) soraSavedMutedBeforeOpen = !!muted;
  soraSoundOn = !muted;
  soraMusicStop();
  soraOpen = true; soraState = 'menu'; soraReset(); soraState = 'menu';
  if($('soraMenuBest')) $('soraMenuBest').textContent = soraBest + ' m';
  if($('soraMenuStars')) $('soraMenuStars').textContent = String(starT);
  soraRefreshTestProfile(); soraBindTestProfileTools();
  var sb = $('soraSoundBtn'); if(sb){ sb.textContent=soraSoundOn?'🔊 Som':'🔇 Som'; sb.setAttribute('aria-pressed',soraSoundOn?'true':'false'); sb.setAttribute('aria-label',soraSoundOn?'Desativar som':'Ativar som'); sb.title=soraSoundOn?'Desativar som':'Ativar som'; }
  if($('soraMenuBox')) $('soraMenuBox').hidden = false;
  if($('soraOverBox')) $('soraOverBox').hidden = true;
  var launcher = $('openSoraBtn'); if(launcher) launcher.style.display = 'none';
  $('soraOv').hidden = false;
  soraLastT = performance.now(); cancelAnimationFrame(soraRaf); soraRaf = requestAnimationFrame(soraLoop);
}
// A background-cached iframe must resume RAF/audio on pageshow.
function soraSuspendForNavigation(){
 soraMusicStop();soraTouchDir=0;soraKeyL=false;soraKeyR=false;
 if(soraRaf){cancelAnimationFrame(soraRaf);soraRaf=0;}
}
window.addEventListener('pagehide',soraSuspendForNavigation);
window.addEventListener('pageshow',function(){
 if(!soraOpen||soraRaf)return;
 soraLastT=performance.now();soraRaf=requestAnimationFrame(soraLoop);
 if(soraState==='play'&&!document.hidden&&soraSoundOn&&!muted)soraMusicStart();
});
function soraCloseUI(){
  if(soraState === 'play') soraOnlineAbortRun();
  if($('soraHomeBtn')) $('soraHomeBtn').hidden = true;
  soraMusicStop(); soraOpen = false; soraState = 'menu'; soraTouchDir = 0; soraKeyL = false; soraKeyR = false;
  cancelAnimationFrame(soraRaf); soraRaf=0; if($('soraOv')) $('soraOv').hidden = true;
  var launcher = $('openSoraBtn'); if(launcher) launcher.style.display = '';
  if(soraSavedMutedBeforeOpen !== null){ muted = soraSavedMutedBeforeOpen; soraSavedMutedBeforeOpen = null; }
}
})();</script>

<script>
(function(){
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('#soraBackTopBtn,#soraCloseBtn'):null;
    if(b){
      e.preventDefault();
      // Capture otherwise blocks onclick, so run the game's cleanup first.
      if(typeof b.onclick==='function')b.onclick.call(b,e);
      e.stopImmediatePropagation();
      // Dentro do pop-up: so avisa a pagina de fora. NUNCA navegar o iframe, senao
      // a pagina principal abre dentro do proprio pop-up. Fora dele, vai para a raiz.
      if(parent!==window){
        try{parent.postMessage({type:'tsulipa-games-hub'},location.origin);}
        catch(_){try{parent.postMessage({type:'tsulipa-games-hub'},'*');}catch(__){}}
      }else{ location.href='./'; }
    }
  },true);
  document.addEventListener('DOMContentLoaded',function(){
    var input=document.getElementById('nick');
    if(input&&!String(input.value||'').trim()){
      var saved='';try{saved=window.__TW_TEST_STORAGE?(window.__TW_TEST_STORAGE.getItem('brs48cr_nick')||''):(localStorage.getItem('brs48cr_nick')||'');}catch(_){}
      input.value=String(saved).trim()||'Tsu';
    }
    var launcher=document.getElementById('openSoraBtn');
    try{if(launcher)launcher.click();}finally{var preload=document.getElementById('twSoraStandAlonePreload');if(preload)preload.remove();}
  });
})();
</script>


<script id="twSoraEmbedSoundBridge">
(function(){
  try{if(new URLSearchParams(location.search).get('embed')!=='index2'||parent===window)return;}catch(e){return;}
  function report(){
    try{
      parent.postMessage({type:'TW_SORA_SOUND_STATE',enabled:typeof soraSoundOn==='boolean'?soraSoundOn:true},
        location.protocol==='file:'?'*':location.origin);
    }catch(e){}
  }
  window.addEventListener('message',function(e){
    if(e.source!==parent)return;
    if(location.protocol!=='file:'&&e.origin!==location.origin)return;
    if(!e.data||(e.data.type!=='TW_SORA_TOGGLE_SOUND'&&e.data.type!=='TW_SORA_GET_SOUND_STATE'))return;
    if(e.data.type==='TW_SORA_TOGGLE_SOUND'){
      var b=document.getElementById('soraSoundBtn');
      if(b&&typeof b.click==='function')b.click();
    }
    report();
  });
  window.addEventListener('load',report,{once:true});
})();
</script>
